name: Private Android runtime test
run-name: Android runtime test - ${{ inputs.release_tag }}
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Private release containing the three-APK XAPK
        required: true
        default: local-test-242-v8-lifecycle
        type: string
      base_override_asset:
        description: Optional candidate base APK asset in the same private release
        required: false
        default: ''
        type: string
      resign_keystore_asset:
        description: Optional private test keystore; when set, all extracted APKs are re-signed together
        required: false
        default: ''
        type: string
      dump_vm:
        description: Dump the decrypted PairIP VM image from the running original app
        required: false
        default: false
        type: boolean
      stock_control:
        description: Test cryptographically verified unmodified original instead of the mod
        required: false
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: bus-private-runtime
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_RELEASE_TAG: ${{ inputs.release_tag }}
      TEST_BASE_OVERRIDE_ASSET: ${{ inputs.base_override_asset }}
      TEST_RESIGN_KEYSTORE_ASSET: ${{ inputs.resign_keystore_asset }}
      TEST_STOCK_CONTROL: ${{ inputs.stock_control }}
      TEST_DUMP_VM: ${{ inputs.dump_vm }}
      ANDROID_SERIAL: emulator-5554
      ANDROID_AVD_HOME: /home/runner/.android/avd
      ANDROID_USER_HOME: /home/runner/.android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify KVM and obtain private test package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          test -c /dev/kvm
          test "$(grep -Eoc '(vmx|svm)' /proc/cpuinfo)" -gt 0
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm
          gh release download "$TEST_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.xapk' --dir downloaded-game
          if [ "$TEST_STOCK_CONTROL" = true ]; then
            for name in stock-original-base.apk stock-original-config.apk stock-original-asset-layout.zip stock-original-manifest.json; do
              gh release download "$TEST_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir downloaded-game
            done
          fi
          if [ -n "$TEST_BASE_OVERRIDE_ASSET" ]; then
            gh release download "$TEST_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$TEST_BASE_OVERRIDE_ASSET" --output downloaded-game/candidate-base.apk
          fi
          if [ -n "$TEST_RESIGN_KEYSTORE_ASSET" ]; then
            gh release download "$TEST_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$TEST_RESIGN_KEYSTORE_ASSET" --output downloaded-game/test-signing.jks
          fi
      - name: Prepare Android 15 image with ARM64 translation
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes 2>/dev/null || true) | "$SDKMANAGER" 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -accel-check
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name BusRuntime --path "$ANDROID_AVD_HOME/BusRuntime.avd" --package 'system-images;android-35;google_apis;x86_64'
          cat >> "$ANDROID_AVD_HOME/BusRuntime.avd/config.ini" <<'AVD'
          hw.cpu.ncore=2
          hw.ramSize=3072
          hw.lcd.width=480
          hw.lcd.height=800
          hw.lcd.density=160
          hw.gpu.enabled=yes
          hw.gpu.mode=swangle
          hw.keyboard=yes
          disk.dataPartition.size=6442450944
          AVD
      - name: Boot accelerated emulator and test control then game
        run: |
          set -euxo pipefail
          mkdir -p runtime-results
          "$ANDROID_HOME/platform-tools/adb" start-server
          nohup "$ANDROID_HOME/emulator/emulator" -avd BusRuntime -no-window -no-audio -no-snapshot -no-boot-anim -accel on -memory 3072 -cores 2 -gpu swangle -feature -Vulkan -camera-back none -camera-front none -no-metrics > runtime-results/emulator.log 2>&1 &
          python3 ci/remote_android_runtime.py 2>&1 | tee runtime-results/test-console.txt
      - name: Preserve logs and screenshots in private release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYZIP'
          import os, zipfile
          from pathlib import Path
          out=Path('runtime-'+os.environ['GITHUB_RUN_ID']+'.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in Path('runtime-results').rglob('*'):
                  if p.is_file(): z.write(p,str(p))
          PYZIP
          gh release upload "$TEST_RELEASE_TAG" "runtime-$GITHUB_RUN_ID.zip" --repo "$GITHUB_REPOSITORY"
